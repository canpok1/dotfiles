# 仕事プロファイルのコンテナへ展開する設定。ここに書いたものだけが配られる（許可リスト）。
# mac の仕事プロファイルは mac/home.nix に別に持つ。
# 新しい設定を仕事環境でも使う場合はここへ追記する。
#
# パスはリポジトリルートからの相対で書く。`#` で始まる行と空行は無視される。
#
# 現在の絞り込み対象は tools/claude/ 配下のみ。vimrc とシェル設定は
# プロファイルに関わらず常に展開されるため、ここに書く必要はない。
tools/claude/CLAUDE.md
tools/claude/settings.json
tools/claude/statusline.sh
tools/claude/rules/coding.md
tools/claude/rules/claude-config.md
tools/claude/rules/investigation.md
tools/claude/skills/retro
tools/claude/skills/wrap-up
